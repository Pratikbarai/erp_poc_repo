[project]
name = "apparel_erp"
authors = [
    { name = "Your Company", email = "admin@example.com" }
]
description = "Apparel PLM: Styles, Colour x Size matrix, auto SKU + BOM generation, Design & Tech Pack"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "weasyprint>=60.0",
    "Pillow>=9.0.0",
    "PyPDF2>=3.0.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<20.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "UP", "B", "RUF"
]
ignore = [
    "B017", "B023", "B028", "B904",
    "E501", "E101", "W191",
    "UP031", "UP030",
    "RUF001", "RUF012"
]
